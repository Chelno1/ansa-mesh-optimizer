version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: sim-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: simulation
      POSTGRES_USER: simuser
      POSTGRES_PASSWORD: simpass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simuser -d simulation"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis缓存和队列
  redis:
    image: redis:7-alpine
    container_name: sim-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    container_name: sim-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Java平台API服务
  platform-api:
    build:
      context: ./platform-api
      dockerfile: Dockerfile
    container_name: sim-platform-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/simulation
      SPRING_DATASOURCE_USERNAME: simuser
      SPRING_DATASOURCE_PASSWORD: simpass123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Python Agent Worker
  agent-worker:
    build:
      context: ./agent-worker
      dockerfile: Dockerfile
    container_name: sim-agent-worker
    ports:
      - "8081:8081"
    environment:
      PLATFORM_API_URL: http://platform-api:8080
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      LOG_LEVEL: INFO
    depends_on:
      - platform-api
      - redis
      - minio
    volumes:
      - agent_work:/app/workspace
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  agent_work:
