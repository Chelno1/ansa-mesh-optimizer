[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ansa-mesh-optimizer"
version = "2.1.0"
description = "高级网格参数优化工具"
readme = "docs/readme.md"
license = {file = "LICENSE"}
authors = [
    {name = "Chel", email = "chel@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "matplotlib",
    "scikit-optimize",
    "scipy",
    "pandas",
    "seaborn",
    "tqdm",
    "joblib",
    "psutil",
    "colorama",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "black",
    "flake8",
    "isort",
    "pre-commit",
]

[project.scripts]
ansa-mesh-optimizer = "ansa_mesh_optimizer.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ansa_mesh_optimizer*"]
exclude = ["tests*"]

[tool.setuptools.package-dir]
"ansa_mesh_optimizer" = "src"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
